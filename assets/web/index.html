<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>psi</title>
<link rel="stylesheet" href="chat.css">
<script src="chat.js" defer></script>
</head>
<body>
<div id="psi-root" style="height:100%"></div>
<script defer>
window.addEventListener('DOMContentLoaded', function () {
  createPsiChat({
    container: document.getElementById('psi-root'),
    wsUrl: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws',
    title: 'psi',
    welcome: 'Connected to your <strong>esp32</strong>. Try ' +
             '<code>system_info</code>, <code>nvs_set</code>, or just chat.',
  });
});
</script>
</body>
</html>
