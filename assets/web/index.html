<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>psi</title>

<!-- CDN-loaded rendering libs. The firmware only ships the page
     skeleton; the browser pulls these from jsDelivr at first paint.
     Pinned versions for reproducibility.
     We assemble the URLs from JS instead of putting them in <link>
     and <script> attributes directly — the literal "package@version"
     pattern triggers Cloudflare's email-obfuscation rewrite (and
     similar DLP filters) which mangles the URL into "[email%20protected]"
     and the request 400s. Building the @ at runtime sidesteps it. -->
<script>
(function () {
  var AT = String.fromCharCode(64); // "@" — keep out of attribute strings
  var CDN = "https://cdn.jsdelivr.net/npm/";
  var libs = [
    { kind: "css",    pkg: "highlight.js",  ver: "11.10.0", path: "/styles/github-dark.min.css" },
    { kind: "script", pkg: "marked",        ver: "15.0.7",  path: "/lib/marked.umd.min.js" },
    { kind: "script", pkg: "dompurify",     ver: "3.2.7",   path: "/dist/purify.min.js" },
    { kind: "script", pkg: "highlight.js",  ver: "11.10.0", path: "/build/highlight.min.js" }
  ];
  libs.forEach(function (l) {
    var href = CDN + l.pkg + AT + l.ver + l.path;
    var el;
    if (l.kind === "css") {
      el = document.createElement("link");
      el.rel = "stylesheet";
      el.href = href;
    } else {
      el = document.createElement("script");
      el.src = href;
      el.defer = true;
    }
    document.head.appendChild(el);
  });
})();
</script>

<style>
:root {
  color-scheme: dark;
  --bg: #0b0d12;
  --bg-elev: #11151c;
  --bg-input: #0a0c12;
  --border: #1d2230;
  --text: #d8dde6;
  --text-dim: #8b94a8;
  --text-muted: #5a6373;
  --accent: #6aa9ff;
  --error: #ef6868;
  --error-bg: #1a0d10;
  --user-bg: #1c2433;
  --tool-bg: #0d1218;
  --thinking: #6b7280;
  /* The chat column is 2/3 of viewport width on desktop, capped so
     it never gets unreadably wide on big monitors. Mobile drops to
     near-full width. */
  --content-w: 66vw;
  --content-w-narrow: 96vw;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 15px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

header {
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
header h1 {
  font-size: 13px;
  font-weight: 600;
  margin: 0;
  letter-spacing: .3px;
}
header .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 6px #4ade80;
  transition: background .2s, box-shadow .2s;
}
header .dot.off { background: var(--error); box-shadow: 0 0 6px var(--error); }
header .dot.busy { background: #f5b942; box-shadow: 0 0 6px #f5b942; }
header .meta {
  color: var(--text-muted);
  font-size: 12px;
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}

/* The chat surface holds bubbles centered in a 2/3-width column. The
   container fills the viewport for scrolling; an inner column constrains
   actual content width. Same for the composer below. */
main {
  flex: 1;
  overflow-y: auto;
  scroll-behavior: smooth;
}
.column {
  width: var(--content-w);
  max-width: 980px;
  margin: 0 auto;
  padding: 24px 0 12px;
}
@media (max-width: 900px) {
  .column { width: var(--content-w-narrow); }
}

.bubble {
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 12px;
  word-break: break-word;
  font-size: 14.5px;
  line-height: 1.55;
}
.bubble.user {
  background: var(--user-bg);
  color: #f3f4f6;
  margin-left: 12%;
  white-space: pre-wrap;
}
.bubble.assistant {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  margin-right: 12%;
}
.bubble.assistant > :first-child { margin-top: 0; }
.bubble.assistant > :last-child  { margin-bottom: 0; }

.bubble.thinking {
  background: transparent;
  color: var(--thinking);
  font-style: italic;
  border-left: 2px solid #2a3140;
  padding: 4px 12px;
  margin: 4px 12% 4px 0;
  white-space: pre-wrap;
  font-size: 13.5px;
}
.bubble.error {
  background: var(--error-bg);
  border: 1px solid #5a1d23;
  color: #fca5a5;
  font-size: 13px;
  text-align: center;
}

/* Tool call + result combined block. The header is the toggle handle;
   the body shows compact JSON in monospace. Default collapsed so a
   long agent run doesn't overwhelm the conversation flow. */
.tool {
  margin: 6px 12% 12px 0;
  background: var(--tool-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.tool > summary {
  list-style: none;
  cursor: pointer;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary::before {
  content: "▸";
  color: var(--text-muted);
  transition: transform .15s;
  display: inline-block;
}
.tool[open] > summary::before { transform: rotate(90deg); }
.tool .name { color: var(--accent); font-weight: 600; }
.tool .id { color: var(--text-muted); font-size: 11px; margin-left: auto; }
.tool .body { padding: 0 12px 10px 28px; }
.tool .body pre {
  margin: 6px 0;
  padding: 6px 8px;
  background: var(--bg-input);
  border-radius: 4px;
  overflow-x: auto;
}
.tool .label { color: var(--text-dim); font-size: 11px; margin-top: 6px; }

/* Markdown content rendered via marked. Cap heading sizes so the
   bubble flow doesn't get visually overwhelmed. */
.md h1, .md h2, .md h3, .md h4 {
  font-size: 1.05em;
  margin: 0.6em 0 0.4em;
  font-weight: 600;
  letter-spacing: .2px;
}
.md p { margin: 0.5em 0; }
.md ul, .md ol { padding-left: 1.4em; margin: 0.4em 0; }
.md li { margin: 0.2em 0; }
.md code {
  background: var(--bg-input);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 0.92em;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.md pre {
  background: var(--bg-input);
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 0.9em;
  margin: 0.6em 0;
}
.md pre code { background: transparent; padding: 0; font-size: inherit; }
.md blockquote {
  border-left: 3px solid var(--border);
  margin: 0.5em 0;
  padding: 0.1em 0 0.1em 0.9em;
  color: var(--text-dim);
}
.md a { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
.md table { border-collapse: collapse; margin: 0.5em 0; }
.md th, .md td { border: 1px solid var(--border); padding: 4px 8px; }

/* Composer */
footer {
  border-top: 1px solid var(--border);
  background: var(--bg);
  padding: 12px 0 16px;
  flex-shrink: 0;
}
form { display: flex; gap: 8px; align-items: flex-end; }
form textarea {
  flex: 1;
  resize: none;
  padding: 9px 12px;
  font: inherit;
  font-size: 14px;
  color: var(--text);
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
  min-height: 40px;
  max-height: 240px;
  line-height: 1.5;
}
form textarea:focus { border-color: var(--accent); }
form button {
  height: 40px;
  padding: 0 16px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  color: #f3f4f6;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background .15s, opacity .15s;
}
form button:hover:not(:disabled) { background: #5396f5; }
form button.abort { background: var(--error); }
form button.abort:hover { background: #d65555; }
form button:disabled { opacity: .4; cursor: not-allowed; }

.welcome {
  color: var(--text-muted);
  text-align: center;
  padding: 64px 16px;
  font-size: 14px;
}
.welcome strong { color: var(--text-dim); }
.welcome code {
  background: var(--bg-elev);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 13px;
  font-family: ui-monospace, monospace;
}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot" aria-label="connection status"></span>
  <h1>psi</h1>
  <span class="meta" id="meta">connecting…</span>
</header>

<main id="log">
  <div class="column" id="col">
    <div class="welcome" id="welcome">
      Connected to your <strong>esp32</strong>. Try
      <code>system_info</code>, <code>nvs_set</code>, or just chat.
    </div>
  </div>
</main>

<footer>
  <div class="column">
    <form id="f">
      <textarea id="t" rows="1" placeholder="message…" autofocus></textarea>
      <button id="send" type="submit">send</button>
    </form>
  </div>
</footer>

<script>
(() => {
  // Wait for deferred CDN scripts before allowing markdown render.
  // First-load delta might arrive before the libs are loaded; we
  // fall back to plain text in that window and re-render once ready.
  const ready = new Promise(resolve => {
    const check = () => (window.marked && window.DOMPurify && window.hljs)
      ? resolve()
      : setTimeout(check, 30);
    check();
  });

  const col = document.getElementById('col');
  const main = document.getElementById('log');
  const dot = document.getElementById('dot');
  const meta = document.getElementById('meta');
  const ta = document.getElementById('t');
  const send = document.getElementById('send');
  const form = document.getElementById('f');
  const welcome = document.getElementById('welcome');
  let ws, current = null, busy = false, currentRaw = '';
  const toolElems = new Map(); /* tool_use id -> <details> element */

  function clearWelcome() {
    if (welcome && welcome.parentNode) welcome.remove();
  }

  function append(el) {
    clearWelcome();
    col.appendChild(el);
    main.scrollTop = main.scrollHeight;
    return el;
  }

  function bubble(cls, text) {
    const el = document.createElement('div');
    el.className = 'bubble ' + cls;
    if (text != null) el.textContent = text;
    return append(el);
  }

  function makeAssistantBubble() {
    const el = document.createElement('div');
    el.className = 'bubble assistant md';
    return append(el);
  }

  function renderMarkdown(el, raw) {
    if (!window.marked || !window.DOMPurify) {
      el.textContent = raw;
      return;
    }
    const html = window.marked.parse(raw, { breaks: true, gfm: true });
    el.innerHTML = window.DOMPurify.sanitize(html);
    if (window.hljs) {
      el.querySelectorAll('pre code').forEach(b => window.hljs.highlightElement(b));
    }
    main.scrollTop = main.scrollHeight;
  }

  function pretty(obj) {
    try { return JSON.stringify(obj, null, 2); } catch (_) { return String(obj); }
  }

  function tool(name, id, input, ok) {
    const det = document.createElement('details');
    det.className = 'tool';
    det.dataset.id = id || '';
    const sum = document.createElement('summary');
    const nameEl = document.createElement('span');
    nameEl.className = 'name';
    nameEl.textContent = name + (ok === false ? ' ✕' : ok === true ? ' ✓' : ' …');
    sum.appendChild(nameEl);
    if (id) {
      const idEl = document.createElement('span');
      idEl.className = 'id';
      idEl.textContent = id.slice(-8);
      sum.appendChild(idEl);
    }
    det.appendChild(sum);
    const body = document.createElement('div');
    body.className = 'body';
    if (input != null) {
      const lab = document.createElement('div'); lab.className = 'label'; lab.textContent = 'input';
      body.appendChild(lab);
      const pre = document.createElement('pre');
      pre.textContent = typeof input === 'string' ? input : pretty(input);
      body.appendChild(pre);
    }
    det.appendChild(body);
    det._body = body;
    return append(det);
  }

  function attachToolResult(det, output, ok) {
    if (!det) return;
    const sum = det.querySelector('summary .name');
    if (sum) {
      const txt = sum.textContent.replace(/[\s✓✕…]+$/, '');
      sum.textContent = txt + (ok ? ' ✓' : ' ✕');
    }
    const lab = document.createElement('div'); lab.className = 'label'; lab.textContent = 'output';
    det._body.appendChild(lab);
    const pre = document.createElement('pre');
    pre.textContent = typeof output === 'string' ? output : pretty(output);
    det._body.appendChild(pre);
    main.scrollTop = main.scrollHeight;
  }

  function setBusy(b) {
    busy = b;
    send.textContent = b ? 'abort' : 'send';
    send.classList.toggle('abort', b);
    send.disabled = false;
    if (dot.classList.contains('off')) return;
    dot.classList.toggle('busy', b);
  }

  function ensureCurrent() {
    if (!current || current._kind === 'thinking') {
      current = makeAssistantBubble();
      current._kind = 'assistant';
      currentRaw = '';
    }
    return current;
  }

  function flushAssistant() {
    if (current) {
      if (current._kind === 'assistant') renderMarkdown(current, currentRaw);
      current = null;
      currentRaw = '';
    }
  }

  function connect() {
    const url = (location.protocol === 'https:' ? 'wss://' : 'ws://')
              + location.host + '/ws';
    ws = new WebSocket(url);
    ws.onopen = () => {
      dot.classList.remove('off');
      meta.textContent = 'connected';
    };
    ws.onclose = () => {
      dot.classList.add('off');
      dot.classList.remove('busy');
      meta.textContent = 'disconnected — reconnecting…';
      setBusy(false);
      flushAssistant();
      setTimeout(connect, 1500);
    };
    ws.onerror = () => { meta.textContent = 'error'; };
    ws.onmessage = ev => {
      let m;
      try { m = JSON.parse(ev.data); } catch (_) { return; }
      switch (m.type) {
        case 'assistant_delta':
          ensureCurrent();
          currentRaw += m.text || '';
          // Cheap incremental render: re-parse the whole accumulated
          // string. Markdown parsers are fast enough at agent-text
          // length that this is invisible.
          renderMarkdown(current, currentRaw);
          break;
        case 'thinking_delta': {
          if (!current || current._kind !== 'thinking') {
            flushAssistant();
            current = bubble('thinking', '');
            current._kind = 'thinking';
          }
          current.textContent += m.text || '';
          main.scrollTop = main.scrollHeight;
          break;
        }
        case 'tool_call': {
          flushAssistant();
          const det = tool(m.name, m.id, m.input);
          if (m.id) toolElems.set(m.id, det);
          break;
        }
        case 'tool_result': {
          const det = toolElems.get(m.id);
          if (det) attachToolResult(det, m.output, m.ok !== false);
          else tool(m.name || 'result', m.id, null, m.ok !== false);
          break;
        }
        case 'turn_end':
          flushAssistant();
          setBusy(false);
          break;
        case 'error':
          flushAssistant();
          bubble('error', m.message || 'error');
          setBusy(false);
          break;
      }
    };
  }

  async function submit() {
    if (busy) {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'abort' }));
      return;
    }
    const text = ta.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    bubble('user', text);
    ta.value = '';
    ta.style.height = 'auto';
    flushAssistant();
    toolElems.clear();
    setBusy(true);
    ws.send(JSON.stringify({ type: 'user', text: text }));
    await ready; // ensure markdown libs are ready before first delta arrives
  }

  form.addEventListener('submit', e => { e.preventDefault(); submit(); });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 240) + 'px';
  });

  connect();
})();
</script>
</body>
</html>
