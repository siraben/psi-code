name: Set up CI environment
description: >
  Export writable HOME and XDG_CACHE_HOME for Nix. If build-dir-suffix is set,
  also export a fresh per-run CI_BUILD_DIR and symlink ./build to it.

inputs:
  build-dir-suffix:
    description: Suffix appended to CI_BUILD_DIR. Empty means no build dir.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SUFFIX: ${{ inputs.build-dir-suffix }}
      run: |
        tag="/tmp/psi-ci-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
        home_dir="${tag}-home"
        cache_dir="${tag}-cache"
        rm -rf "$home_dir" "$cache_dir"
        mkdir -p "$home_dir" "$cache_dir"
        echo "HOME=$home_dir" >> "$GITHUB_ENV"
        echo "XDG_CACHE_HOME=$cache_dir" >> "$GITHUB_ENV"
        if [ -n "$SUFFIX" ]; then
          build_dir="${tag}-${SUFFIX}"
          rm -rf build "$build_dir"
          mkdir -p "$build_dir"
          ln -s "$build_dir" build
          echo "CI_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
        fi
