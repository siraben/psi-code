name: Set up CI environment
description: >
  Export HOME and XDG_CACHE_HOME under the workspace so nix can write to them.
  If build-dir-suffix is set, also export a fresh per-run CI_BUILD_DIR and
  symlink ./build to it.

inputs:
  build-dir-suffix:
    description: Suffix appended to CI_BUILD_DIR. Empty means no build dir.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SUFFIX: ${{ inputs.build-dir-suffix }}
      run: |
        echo "HOME=$PWD/.home" >> "$GITHUB_ENV"
        echo "XDG_CACHE_HOME=$PWD/.cache" >> "$GITHUB_ENV"
        mkdir -p "$PWD/.home" "$PWD/.cache"
        if [ -n "$SUFFIX" ]; then
          build_dir="/tmp/psi-ci-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-${SUFFIX}"
          rm -rf build "$build_dir"
          mkdir -p "$build_dir"
          ln -s "$build_dir" build
          echo "CI_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
        fi
