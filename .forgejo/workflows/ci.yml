name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    build-users-group =
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TERM: xterm-256color
  FORGEJO_CI_URL: http://127.0.0.1:3010
  FORGEJO_CI_REPOSITORY: siraben/psi-coding-agent
  # actions/checkout is a JS action and the runner image (nixos/nix:latest)
  # has no Node, so we hand-roll the fetch. The repo isn't on disk yet, so a
  # composite action can't help here either: its action.yml lives in the repo.
  FETCH_SCRIPT: |
    token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
    workspace="/tmp/psi-ci-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-workspace"
    rm -rf "$workspace"
    mkdir -p "$workspace"
    cd "$workspace"
    git init .
    git remote add origin "${FORGEJO_CI_URL%/}/${FORGEJO_CI_REPOSITORY}"
    fetch_ref() {
      if [ -n "$token" ]; then
        auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
        GIT_TERMINAL_PROMPT=0 git -c "http.extraHeader=Authorization: Basic $auth_header" fetch --quiet --depth=1 origin "$1"
      else
        GIT_TERMINAL_PROMPT=0 git fetch --quiet --depth=1 origin "$1"
      fi
    }
    # When a pipeline pileup has every job container fetching at once, the
    # server intermittently refuses connections and git exits 128 within
    # seconds, failing the job before it does any work. Retry each ref with
    # backoff before falling through to the next one.
    fetch_ref_retry() {
      attempt=1
      until fetch_ref "$1"; do
        [ "$attempt" -ge 5 ] && return 1
        sleep $((attempt * 3))
        attempt=$((attempt + 1))
      done
    }
    fetch_ref_retry "$GITHUB_SHA" ||
      fetch_ref_retry "$GITHUB_REF" ||
      fetch_ref_retry "+refs/pull/*/head:refs/remotes/origin/pr/*"
    git checkout --detach "$GITHUB_SHA"
  SETUP_SCRIPT: |
    tag="/tmp/psi-ci-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
    home_dir="${tag}-home"
    cache_dir="${tag}-cache"
    rm -rf "$home_dir" "$cache_dir"
    mkdir -p "$home_dir" "$cache_dir"
    export HOME="$home_dir"
    export XDG_CACHE_HOME="$cache_dir"
    if [ -n "${BUILD_DIR_SUFFIX:-}" ]; then
      build_dir="${tag}-${BUILD_DIR_SUFFIX}"
      rm -rf build "$build_dir"
      mkdir -p "$build_dir"
      ln -s "$build_dir" build
      export CI_BUILD_DIR="$build_dir"
    fi

jobs:
  format:
    name: C formatting
    runs-on: docker
    steps:
      - name: Check C formatting
        run: |
          eval "$FETCH_SCRIPT"
          eval "$SETUP_SCRIPT"
          nix develop --command make check-format-c

  style:
    name: Style and static analysis
    runs-on: docker
    needs: [format]
    steps:
      - name: Run style and static analysis
        env:
          BUILD_DIR_SUFFIX: ${{ github.job }}
        run: |
          eval "$FETCH_SCRIPT"
          eval "$SETUP_SCRIPT"
          nix develop --command make BUILD_DIR="$CI_BUILD_DIR" lint

  sbom-audit:
    name: SBOM audit
    runs-on: docker
    needs: [valgrind]
    steps:
      - name: Run runtime dependency audit
        run: |
          eval "$FETCH_SCRIPT"
          eval "$SETUP_SCRIPT"
          nix run .#audit-sbom -- .#default sbom

  infer:
    name: Infer static analysis
    runs-on: docker
    needs: [style]
    steps:
      - name: Run Infer
        run: |
          eval "$FETCH_SCRIPT"
          eval "$SETUP_SCRIPT"
          tag="/tmp/psi-ci-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          export INFER_BUILD_DIR="${tag}-build"
          export INFER_RESULTS_DIR="${tag}-infer-out"
          nix run .#infer

  scan-build:
    name: Clang static analyzer
    runs-on: docker
    needs: [infer]
    steps:
      - name: Run scan-build
        run: |
          eval "$FETCH_SCRIPT"
          eval "$SETUP_SCRIPT"
          export SCAN_BUILD_BUILD_DIR="/tmp/psi-ci-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-build"
          nix run .#scan-build

  feature-smoke:
    name: Build and smoke feature variants
    runs-on: docker
    needs: [scan-build]
    steps:
      - name: Build and run smoke variants
        run: |
          eval "$FETCH_SCRIPT"
          eval "$SETUP_SCRIPT"
          run_feature() {
            name="$1"
            make_flags="$2"
            smoke_excludes="$3"
            build_dir="/tmp/psi-ci-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-${name}"
            rm -rf build "$build_dir"
            mkdir -p "$build_dir"
            ln -s "$build_dir" build
            MAKE_FLAGS="$make_flags" SMOKE_EXCLUDES="$smoke_excludes" CI_BUILD_DIR="$build_dir" bash scripts/ci/build-and-smoke.sh
          }
          run_feature default "" ""
          run_feature no-tui "TUI=0" "events/tui,render/tui,tui/,mode/tui"
          run_feature no-ansi "ANSI=0" "events/tui,render/tui,tui/,mode/tui,commands/rainbow,markdown/inline_code_no_backticks,theme/compound_ansi_mapping,theme/composite_ansi_remap,ansi/windows_console_force_ansi,ansi/windows_console_plain_by_default,ansi/windows_msys_allows_ansi,ansi/windows_xterm_allows_ansi"
          run_feature no-color "COLOR=0" "commands/rainbow,mode/tui_rainbow,tui/raw_ansi_available_with_ansi,tui/windows_console_allows_raw_ansi,mode/tui_theme_applies_to_rendered_colors,mode/tui_input_box_background,theme/compound_ansi_mapping,theme/composite_ansi_remap,ansi/windows_console_force_ansi,ansi/windows_console_plain_by_default,ansi/windows_msys_allows_ansi,ansi/windows_xterm_allows_ansi"
          run_feature no-repl-editline "REPL_EDITLINE=0" ""
          run_feature minimal "TUI=0 ANSI=0 COLOR=0 REPL_EDITLINE=0" "events/tui,render/tui,tui/,mode/tui,commands/rainbow,markdown/inline_code_no_backticks,theme/compound_ansi_mapping,theme/composite_ansi_remap,ansi/windows_console_force_ansi,ansi/windows_console_plain_by_default,ansi/windows_msys_allows_ansi,ansi/windows_xterm_allows_ansi"

  libc-smoke:
    name: Libc package and smoke variants
    runs-on: docker
    needs: [feature-smoke]
    steps:
      - name: Build packages and run smoke tests when applicable
        run: |
          eval "$FETCH_SCRIPT"
          eval "$SETUP_SCRIPT"
          run_package() {
            PACKAGE_ATTR="$1" NIX_BUILD_FLAGS="$2" SMOKE_EXCLUDES="$3" bash scripts/ci/package-smoke.sh
          }
          run_package psi-gcc "" ""
          run_package psi-static "" ""
          run_package psi-cosmocc "" ""
          run_package c-ward "" ""

  compiler-smoke:
    name: Compiler package and smoke variants
    runs-on: docker
    needs: [libc-smoke]
    steps:
      - name: Build packages and run smoke tests
        run: |
          eval "$FETCH_SCRIPT"
          eval "$SETUP_SCRIPT"
          run_package() {
            PACKAGE_ATTR="$1" SMOKE_EXCLUDES="$2" bash scripts/ci/package-smoke.sh
          }
          run_package psi-gcc ""
          run_package psi-gcc46 ""
          run_package psi-clang ""
          run_package psi-tcc ""
          run_package psi-compcert ""

  valgrind:
    name: Valgrind
    runs-on: docker
    needs: [compiler-smoke]
    steps:
      - name: Run memcheck harness
        env:
          BUILD_DIR_SUFFIX: ${{ github.job }}
        run: |
          eval "$FETCH_SCRIPT"
          eval "$SETUP_SCRIPT"
          nix develop --command bash -euxo pipefail -c '
            make BUILD_DIR="$CI_BUILD_DIR"
            bash tests/valgrind.sh
          '
