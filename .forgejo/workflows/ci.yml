name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    build-users-group =
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TERM: xterm-256color
  FORGEJO_CI_URL: http://127.0.0.1:3010
  FORGEJO_CI_REPOSITORY: siraben/psi-coding-agent
  # actions/checkout is a JS action and the runner image (nixos/nix:latest)
  # has no Node, so we hand-roll the fetch. The repo isn't on disk yet, so a
  # composite action can't help here either: its action.yml lives in the repo.
  FETCH_SCRIPT: |
    token="${FORGEJO_TOKEN:-$GITHUB_TOKEN}"
    git init .
    git remote add origin "${FORGEJO_CI_URL%/}/${FORGEJO_CI_REPOSITORY}"
    fetch_ref() {
      if [ -n "$token" ]; then
        auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
        GIT_TERMINAL_PROMPT=0 git -c "http.extraHeader=Authorization: Basic $auth_header" fetch --quiet --depth=1 origin "$1"
      else
        GIT_TERMINAL_PROMPT=0 git fetch --quiet --depth=1 origin "$1"
      fi
    }
    fetch_ref "$GITHUB_SHA" ||
      fetch_ref "$GITHUB_REF" ||
      fetch_ref "+refs/pull/*/head:refs/remotes/origin/pr/*"
    git checkout --detach "$GITHUB_SHA"

jobs:
  format:
    name: C formatting
    runs-on: docker
    steps:
      - name: Checkout
        run: eval "$FETCH_SCRIPT"
      - uses: ./.forgejo/actions/setup
      - run: nix develop --command make check-format-c

  style:
    name: Style and static analysis
    runs-on: docker
    steps:
      - name: Checkout
        run: eval "$FETCH_SCRIPT"
      - uses: ./.forgejo/actions/setup
        with:
          build-dir-suffix: ${{ github.job }}
      - run: nix develop --command make BUILD_DIR="$CI_BUILD_DIR" lint

  sbom-audit:
    name: SBOM audit
    runs-on: docker
    needs: [format, style]
    steps:
      - name: Checkout
        run: eval "$FETCH_SCRIPT"
      - uses: ./.forgejo/actions/setup
      - name: Run runtime dependency audit
        run: nix run .#audit-sbom -- .#default sbom

  infer:
    name: Infer static analysis
    runs-on: docker
    needs: [format, style]
    steps:
      - name: Checkout
        run: eval "$FETCH_SCRIPT"
      - uses: ./.forgejo/actions/setup
      - name: Run Infer
        run: |
          tag="/tmp/psi-ci-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          export INFER_BUILD_DIR="${tag}-build"
          export INFER_RESULTS_DIR="${tag}-infer-out"
          nix run .#infer

  scan-build:
    name: Clang static analyzer
    runs-on: docker
    needs: [format, style]
    steps:
      - name: Checkout
        run: eval "$FETCH_SCRIPT"
      - uses: ./.forgejo/actions/setup
      - name: Run scan-build
        run: |
          export SCAN_BUILD_BUILD_DIR="/tmp/psi-ci-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-build"
          nix run .#scan-build

  feature-matrix:
    name: Build and smoke (${{ matrix.name }})
    runs-on: docker
    needs: [format, style]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            make_flags: ""
            smoke_excludes: ""
          - name: no-tui
            make_flags: "TUI=0"
            smoke_excludes: "events/tui,render/tui,tui/,mode/tui"
          - name: no-ansi
            make_flags: "ANSI=0"
            smoke_excludes: "events/tui,render/tui,tui/,mode/tui,commands/rainbow,markdown/inline_code_no_backticks,theme/compound_ansi_mapping,theme/composite_ansi_remap"
          - name: no-color
            make_flags: "COLOR=0"
            smoke_excludes: "commands/rainbow,mode/tui_rainbow,tui/raw_ansi_available_with_ansi,mode/tui_theme_applies_to_rendered_colors,mode/tui_input_box_background,theme/compound_ansi_mapping,theme/composite_ansi_remap"
          - name: no-repl-editline
            make_flags: "REPL_EDITLINE=0"
            smoke_excludes: ""
          - name: minimal
            make_flags: "TUI=0 ANSI=0 COLOR=0 REPL_EDITLINE=0"
            smoke_excludes: "events/tui,render/tui,tui/,mode/tui,commands/rainbow,markdown/inline_code_no_backticks,theme/compound_ansi_mapping,theme/composite_ansi_remap"
    steps:
      - name: Checkout
        run: eval "$FETCH_SCRIPT"
      - uses: ./.forgejo/actions/setup
        with:
          build-dir-suffix: feature-${{ matrix.name }}
      - name: Build and run smoke tests
        env:
          MAKE_FLAGS: ${{ matrix.make_flags }}
          SMOKE_EXCLUDES: ${{ matrix.smoke_excludes }}
        run: bash scripts/ci/build-and-smoke.sh

  libc-matrix:
    name: Libc package and smoke (${{ matrix.name }})
    runs-on: docker
    needs: [format, style]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glibc
            package: psi-gcc
            nix_build_flags: ""
            smoke_excludes: ""
          - name: musl-static
            package: psi-static
            nix_build_flags: ""
            smoke_excludes: ""
          - name: cosmo
            package: psi-cosmocc
            nix_build_flags: ""
            smoke_excludes: ""
          - name: c-ward
            package: c-ward
            nix_build_flags: ""
            smoke_excludes: ""
    steps:
      - name: Checkout
        run: eval "$FETCH_SCRIPT"
      - uses: ./.forgejo/actions/setup
      - name: Build package and run smoke tests when applicable
        env:
          PACKAGE_ATTR: ${{ matrix.package }}
          NIX_BUILD_FLAGS: ${{ matrix.nix_build_flags }}
          SMOKE_EXCLUDES: ${{ matrix.smoke_excludes }}
        run: bash scripts/ci/package-smoke.sh

  compiler-matrix:
    name: Compiler package and smoke (${{ matrix.name }})
    runs-on: docker
    needs: [format, style]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            package: psi-gcc
            smoke_excludes: ""
          - name: gcc46
            package: psi-gcc46
            smoke_excludes: ""
          - name: clang
            package: psi-clang
            smoke_excludes: ""
          - name: tcc
            package: psi-tcc
            smoke_excludes: ""
          - name: compcert
            package: psi-compcert
            smoke_excludes: ""
    steps:
      - name: Checkout
        run: eval "$FETCH_SCRIPT"
      - uses: ./.forgejo/actions/setup
      - name: Build package and run smoke tests
        env:
          PACKAGE_ATTR: ${{ matrix.package }}
          SMOKE_EXCLUDES: ${{ matrix.smoke_excludes }}
        run: bash scripts/ci/package-smoke.sh

  valgrind:
    name: Valgrind
    runs-on: docker
    needs: [format, style]
    steps:
      - name: Checkout
        run: eval "$FETCH_SCRIPT"
      - uses: ./.forgejo/actions/setup
        with:
          build-dir-suffix: ${{ github.job }}
      - name: Run memcheck harness
        run: |
          nix develop --command bash -euxo pipefail -c '
            make BUILD_DIR="$CI_BUILD_DIR"
            bash tests/valgrind.sh
          '
