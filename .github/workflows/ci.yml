name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TERM: xterm-256color

jobs:
  format:
    name: C formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check C formatting
        run: |
          nix develop --command make check-format-c

  style:
    name: Style and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [format]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run style and static analysis
        run: |
          nix develop --command make BUILD_DIR="$CI_BUILD_DIR" lint

  sbom-audit:
    name: SBOM audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [valgrind]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run runtime dependency audit
        run: |
          nix run .#audit-sbom -- .#default sbom

  infer:
    name: Infer static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [style]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run Infer
        run: |
          export INFER_BUILD_DIR="$RUNNER_TEMP/infer-build"
          export INFER_RESULTS_DIR="$RUNNER_TEMP/infer-out"
          nix run .#infer

  scan-build:
    name: Clang static analyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [infer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run scan-build
        run: |
          export SCAN_BUILD_BUILD_DIR="$RUNNER_TEMP/scan-build"
          nix run .#scan-build

  feature-matrix:
    name: Build and smoke (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [scan-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            make_flags: ""
            smoke_excludes: ""
          - name: no-tui
            make_flags: "TUI=0"
            smoke_excludes: "events/tui,render/tui,tui/,mode/tui"
          - name: no-ansi
            make_flags: "ANSI=0"
            smoke_excludes: "events/tui,render/tui,tui/,mode/tui,commands/rainbow,markdown/inline_code_no_backticks,theme/compound_ansi_mapping,theme/composite_ansi_remap,ansi/windows_console_force_ansi,ansi/windows_console_plain_by_default,ansi/windows_msys_allows_ansi,ansi/windows_xterm_allows_ansi,ansi/piped_stdout_force_ansi"
          - name: no-color
            make_flags: "COLOR=0"
            smoke_excludes: "commands/rainbow,mode/tui_rainbow,tui/raw_ansi_available_with_ansi,tui/windows_console_allows_raw_ansi,mode/tui_theme_applies_to_rendered_colors,mode/tui_input_box_background,theme/compound_ansi_mapping,theme/composite_ansi_remap,ansi/windows_console_force_ansi,ansi/windows_console_plain_by_default,ansi/windows_msys_allows_ansi,ansi/windows_xterm_allows_ansi,ansi/piped_stdout_force_ansi"
          - name: no-repl-editline
            make_flags: "REPL_EDITLINE=0"
            smoke_excludes: ""
          - name: minimal
            make_flags: "TUI=0 ANSI=0 COLOR=0 REPL_EDITLINE=0"
            smoke_excludes: "events/tui,render/tui,tui/,mode/tui,commands/rainbow,markdown/inline_code_no_backticks,theme/compound_ansi_mapping,theme/composite_ansi_remap,ansi/windows_console_force_ansi,ansi/windows_console_plain_by_default,ansi/windows_msys_allows_ansi,ansi/windows_xterm_allows_ansi,ansi/piped_stdout_force_ansi"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build and run smoke tests
        env:
          MAKE_FLAGS: ${{ matrix.make_flags }}
          SMOKE_EXCLUDES: ${{ matrix.smoke_excludes }}
        run: |
          bash scripts/ci/build-and-smoke.sh

  libc-matrix:
    name: Libc package and smoke (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [feature-matrix]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glibc
            package: psi-gcc
            nix_build_flags: ""
            smoke_excludes: ""
          - name: musl-static
            package: psi-static
            nix_build_flags: ""
            smoke_excludes: ""
          - name: cosmo
            package: psi-cosmocc
            nix_build_flags: ""
            smoke_excludes: ""
          - name: c-ward
            package: c-ward
            nix_build_flags: ""
            smoke_excludes: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build package and run smoke tests when applicable
        env:
          PACKAGE_ATTR: ${{ matrix.package }}
          NIX_BUILD_FLAGS: ${{ matrix.nix_build_flags }}
          SMOKE_EXCLUDES: ${{ matrix.smoke_excludes }}
        run: |
          bash scripts/ci/package-smoke.sh

  compiler-matrix:
    name: Compiler package and smoke (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [libc-matrix]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            package: psi-gcc
            smoke_excludes: ""
          - name: gcc46
            package: psi-gcc46
            smoke_excludes: ""
          - name: clang
            package: psi-clang
            smoke_excludes: ""
          - name: tcc
            package: psi-tcc
            smoke_excludes: ""
          - name: compcert
            package: psi-compcert
            smoke_excludes: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build package and run smoke tests
        env:
          PACKAGE_ATTR: ${{ matrix.package }}
          SMOKE_EXCLUDES: ${{ matrix.smoke_excludes }}
        run: |
          bash scripts/ci/package-smoke.sh

  valgrind:
    name: Valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [compiler-matrix]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run memcheck harness
        run: |
          # CI_BUILD_DIR is expanded by the shell inside nix develop.
          # shellcheck disable=SC2016
          nix develop --command bash -euxo pipefail -c '
            make BUILD_DIR="$CI_BUILD_DIR"
            bash tests/valgrind.sh
          '
