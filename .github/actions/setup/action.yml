name: Set up CI environment
description: Install Nix, configure Cachix, and set the build directory on a GitHub-hosted runner.

inputs:
  github-token:
    description: GitHub token used by Nix to fetch flake inputs without anonymous API limits.
    required: true
  cachix-auth-token:
    description: Optional token for uploading build results to the siraben Cachix cache.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.github-token }}
    - name: Configure Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: siraben
        extraPullNames: nix-community
        authToken: ${{ inputs.cachix-auth-token }}
        # Fork PRs and repositories without a write token can still use the public caches.
        skipPush: ${{ inputs.cachix-auth-token == '' }}
    - name: Set build directory
      shell: bash
      run: echo "CI_BUILD_DIR=$GITHUB_WORKSPACE/build" >> "$GITHUB_ENV"
